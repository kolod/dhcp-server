# Checks every pull request and every push to main.
# Job names are required status checks in .github/rulesets/main.json: rename them together.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: build-test
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and test
        id: build
        uses: ./.github/actions/build-test
        with:
          version: 0.0.0-ci.${{ github.run_number }}

      - name: Upload executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dhcpserver-exe
          path: |
            ${{ steps.build.outputs.exe-dir }}/DhcpServer.exe
            ${{ steps.build.outputs.exe-dir }}/DhcpServer.exe.config
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: ${{ runner.temp }}/test-results/results.trx
          if-no-files-found: warn
          retention-days: 14
